# 把網站自動發布到 GitHub Pages：每次推送到 main 分支，就會測試、建置並更新網站。
# 雲端 API 網址放在 GitHub 的 Repository variables（名稱：VITE_GAS_API_URL），不寫在程式裡。
name: 發布網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:gas
      - run: npm run build
        env:
          VITE_GAS_API_URL: ${{ vars.VITE_GAS_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
